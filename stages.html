<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как идёт проект: 30 стадий — Инженерная студия Дмитрия Клевцова</title>
<link rel="canonical" href="https://klevtsov-engineering.ru/stages.html">
<meta name="description" content="Полная структура инженерного проекта: от брифа и патентной проверки до КД, изготовления, пусконаладки и гарантийного сопровождения. Что делаем сами, что организуем через партнёров.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F11; --bg-2:#131517; --bg-3:#191C1F; --steel:#22262B; --steel-2:#31363D;
  --fg:#E9ECEF; --fg-2:#A4A7AA; --muted:#6E757E; --hot:#FF6500; --hot-soft:rgba(255,101,0,.14);
  --cold:#7FB2D9; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.045);
  --mono:"IBM Plex Mono", ui-monospace, monospace; --sans:"Onest", Arial, sans-serif; --r:2px;
  --shell:min(1180px, 100% - 44px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:16px; line-height:1.55;
  letter-spacing:-.01em; -webkit-font-smoothing:antialiased}
a{color:inherit; text-decoration:none}
.shell{width:var(--shell); margin-inline:auto}
.mono{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:500}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.035em; line-height:1.05}

header{border-bottom:1px solid var(--line); padding:20px 0; position:sticky; top:0; z-index:20;
  background:rgba(14,15,17,.9); backdrop-filter:blur(12px)}
.head-in{display:flex; align-items:center; gap:20px; justify-content:space-between}
.back{display:inline-flex; align-items:center; gap:10px; color:var(--fg-2); font-size:14px}
.back:hover{color:var(--fg)}
.btn{display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 16px; border:1px solid var(--hot);
  background:var(--hot); color:#0E0F11; font-size:14px; font-weight:600; border-radius:var(--r)}
.btn:hover{background:#ff7a26}

.intro{padding:clamp(48px,7vw,96px) 0 clamp(30px,4vw,52px)}
.kicker{display:flex; align-items:center; gap:12px; color:var(--muted); margin-bottom:20px}
.kicker .idx{color:var(--hot)} .kicker .bar{flex:1; height:1px; background:var(--line); max-width:110px}
h1{font-size:clamp(32px,5vw,62px); font-weight:800; max-width:18ch}
.lead{font-size:clamp(16px,1.5vw,20px); color:var(--fg-2); max-width:66ch; margin-top:22px; line-height:1.5}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:30px}
.lg{display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line); padding:8px 13px; font-size:13.5px; color:var(--fg-2)}
.dot{width:8px; height:8px; flex:none; border-radius:50%}
.d-own{background:var(--hot)} .d-partner{background:var(--cold)} .d-doc{background:#9AA3AB} .d-big{background:transparent; border:1px solid var(--muted)}

.gate{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center;
  border:1px solid var(--hot); border-left-width:2px; background:linear-gradient(90deg, var(--hot-soft), transparent 60%);
  padding:16px 20px; margin:26px 0}
.gate b{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--hot)}
.gate span{font-size:15px; color:var(--fg)}

.phase{border-top:1px solid var(--line); padding-top:26px; margin-top:clamp(40px,5vw,70px)}
.phase-head{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(16px,3vw,48px); align-items:end; margin-bottom:26px}
.phase-head h2{font-size:clamp(22px,2.6vw,34px)}
.phase-head p{margin:0; color:var(--muted); font-size:15px}
.stages{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line)}
.stage{background:var(--bg); padding:20px 22px 22px; display:flex; flex-direction:column; gap:9px; position:relative; transition:background .25s}
.stage:hover{background:var(--bg-2)}
.stage .top{display:flex; align-items:baseline; gap:12px}
.stage .n{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.1em}
.stage h3{font-size:17px; font-weight:600; letter-spacing:-.025em; line-height:1.2}
.stage .focus{font-size:14.5px; color:var(--fg-2); line-height:1.5}
.stage .out{font-size:13.5px; color:var(--muted); border-top:1px solid var(--line-2); padding-top:10px; margin-top:auto}
.stage .out b{color:var(--fg-2); font-weight:500}
.stage .mark{position:absolute; right:16px; top:20px; width:8px; height:8px; border-radius:50%}
@media (max-width:820px){.stages{grid-template-columns:1fr} .phase-head{grid-template-columns:1fr; gap:10px; align-items:start}}

.skills{background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  margin-top:clamp(56px,7vw,96px); padding:clamp(44px,6vw,80px) 0}
.skill-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:34px}
.skill{background:var(--bg-2); padding:22px; display:flex; flex-direction:column; gap:8px}
.skill h3{font-size:16px; font-weight:600}
.skill p{margin:0; font-size:14px; color:var(--fg-2); line-height:1.5}
.skill .tools{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:auto; padding-top:12px}
@media (max-width:900px){.skill-grid{grid-template-columns:1fr}}

.note{border:1px solid var(--line); border-left:2px solid var(--cold); background:var(--bg-2);
  padding:18px 20px; margin:30px 0; font-size:15px; color:var(--fg-2); line-height:1.55}
.note b{color:var(--fg)}

.cta{padding:clamp(48px,6vw,90px) 0; text-align:center}
.cta h2{font-size:clamp(24px,3.2vw,40px); max-width:20ch; margin-inline:auto}
.cta p{color:var(--fg-2); margin:18px auto 28px; max-width:52ch}
footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted)}
.foot{display:flex; gap:20px; flex-wrap:wrap; justify-content:space-between}

[data-r]{opacity:0; transform:translateY(14px); transition:opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1)}
[data-r].in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){[data-r]{opacity:1; transform:none}}
</style>
</head>

/* --------- рендер --------- */
const M = document.querySelector('main');
const I = STAGES.intro;
const stageCard = s => `
  <article class="stage">
    <span class="mark d-${s.type}"></span>
    <div class="top"><span class="n">${s.n}</span><h3>${s.t}</h3></div>
    <p class="focus">${s.focus}</p>
    <p class="out"><b>Результат:</b> ${s.out}</p>
  </article>`;

M.innerHTML = `
<section class="intro"><div class="shell">
  <div class="kicker mono" data-r><span class="idx">01</span><span class="bar"></span><span>${I.kicker}</span></div>
  <h1 data-r>${I.title}</h1>
  <p class="lead" data-r>${I.lead}</p>
  <div class="legend" data-r>
    ${STAGES.legend.map(l=>`<span class="lg"><span class="dot d-${l.k}"></span>${l.t}</span>`).join('')}
  </div>
  <div class="note" data-r>${I.note}</div>
</div></section>

<div class="shell">
  ${STAGES.phases.map(p=>`
    <section class="phase" data-r>
      <div class="phase-head">
        <div><div class="kicker mono"><span class="idx">${p.n}</span><span class="bar"></span></div><h2>${p.t}</h2></div>
        <p>${p.logic}</p>
      </div>
      <div class="stages">${p.stages.map(stageCard).join('')}</div>
      ${p.gate ? `<div class="gate"><b>${p.gate.n}</b><span>${p.gate.t}</span></div>` : ''}
    </section>`).join('')}
</div>

<section class="skills"><div class="shell">
  <div class="kicker mono" data-r><span class="idx">02</span><span class="bar"></span><span>Компетенции</span></div>
  <h2 style="font-size:clamp(24px,3.2vw,40px)" data-r>${STAGES.skills.title}</h2>
  <p class="lead" data-r>${STAGES.skills.lead}</p>
  <div class="skill-grid">
    ${STAGES.skills.items.map(s=>`
      <article class="skill" data-r><h3>${s.t}</h3><p>${s.d}</p><div class="tools">${s.tools}</div></article>`).join('')}
  </div>
</div></section>

<section class="cta"><div class="shell">
  <h2 data-r>${STAGES.cta.title}</h2>
  <p data-r>${STAGES.cta.lead}</p>
  <a class="btn" href="index.html#brief" data-r>Описать задачу</a>
</div></section>`;

document.getElementById('y').textContent = new Date().getFullYear();
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),
  {threshold:.1, rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('[data-r]').forEach(el=>io.observe(el));

</script>
