/* =============================================================
   МИНИ-ДВИЖОК 3D (без библиотек): поворот + перспектива
   ============================================================= */
const RM = (p, rx, ry) => {
  let [x,y,z] = p;
  let c=Math.cos(ry), s=Math.sin(ry);
  let X = x*c + z*s, Z = -x*s + z*c;
  c=Math.cos(rx); s=Math.sin(rx);
  let Y = y*c - Z*s; Z = y*s + Z*c;
  return [X,Y,Z];
};
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fitCanvas(cv){
  const r = cv.getBoundingClientRect(), d = DPR();
  if (cv.width !== Math.round(r.width*d) || cv.height !== Math.round(r.height*d)){
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  return { ctx, w:r.width, h:r.height };
}

/* =============================================================
   REVERSE ENGINEERING: физическая деталь → скан → облако точек →
   полигоны → параметрическая модель → чертёж → новая деталь
   ============================================================= */
(function reverseScene(){
  const cv = document.getElementById('reCanvas');
  const wrap = document.getElementById('reScroll');
  if (!cv || !wrap) return;

  /* профиль детали (кронштейн) + отверстия */
  const PROF = [[-1.25,-0.72],[1.25,-0.72],[1.25,-0.18],[-0.42,-0.18],[-0.42,0.95],[-1.25,0.95]];
  const HOLES = [{x:-0.83,y:-0.45,r:0.19},{x:0.82,y:-0.45,r:0.19},{x:-0.83,y:0.60,r:0.19}];
  const D = 0.36, HZ = D/2;

  const inPoly = (x,y)=>{ let c=false;
    for(let i=0,j=PROF.length-1;i<PROF.length;j=i++){
      const [xi,yi]=PROF[i],[xj,yj]=PROF[j];
      if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
    } return c; };
  const inHole = (x,y)=>HOLES.some(h=>Math.hypot(x-h.x,y-h.y) < h.r+0.012);
  const solidAt = (x,y)=> inPoly(x,y) && !inHole(x,y);

  /* решётка точек поверхности (для облака и полигональной сетки) */
  const step = innerWidth < 760 ? 0.115 : 0.085;
  const pts = [], meshE = [];
  const key = new Map();
  const addP = (p,k)=>{ const i=pts.length; pts.push(p); if(k) key.set(k,i); return i; };
  for (const z of [HZ,-HZ]){
    for (let i=-16;i<=16;i++) for (let j=-12;j<=14;j++){
      const x=i*step, y=j*step;
      if (!solidAt(x,y)) continue;
      addP([x,y,z], `c${z>0?1:0}_${i}_${j}`);
    }
  }
  for (const z of [HZ,-HZ]) {
    const s = z>0?1:0;
    for (let i=-16;i<=16;i++) for (let j=-12;j<=14;j++){
      const a=key.get(`c${s}_${i}_${j}`); if(a===undefined) continue;
      const b=key.get(`c${s}_${i+1}_${j}`), c=key.get(`c${s}_${i}_${j+1}`), d=key.get(`c${s}_${i+1}_${j+1}`);
      if(b!==undefined) meshE.push([a,b]);
      if(c!==undefined) meshE.push([a,c]);
      if(d!==undefined) meshE.push([a,d]);
    }
  }
  /* боковые поверхности */
  const per=[]; let acc=0;
  for(let i=0;i<PROF.length;i++){
    const A=PROF[i], B=PROF[(i+1)%PROF.length];
    const L=Math.hypot(B[0]-A[0],B[1]-A[1]); const n=Math.max(2,Math.round(L/step));
    for(let k=0;k<n;k++) per.push([A[0]+(B[0]-A[0])*k/n, A[1]+(B[1]-A[1])*k/n]);
    acc+=L;
  }
  const NZ = 4, sideStart = pts.length;
  for(let k=0;k<per.length;k++) for(let z=0;z<=NZ;z++) addP([per[k][0], per[k][1], -HZ + D*z/NZ]);
  for(let k=0;k<per.length;k++) for(let z=0;z<=NZ;z++){
    const a=sideStart+k*(NZ+1)+z;
    if(z<NZ) meshE.push([a,a+1]);
    const nk=(k+1)%per.length; meshE.push([a, sideStart+nk*(NZ+1)+z]);
  }
  /* отверстия — стенки */
  for (const h of HOLES){
    const st=pts.length, n=14;
    for(let i=0;i<n;i++) for(let z=0;z<=NZ;z++)
      addP([h.x+Math.cos(i/n*6.283)*h.r, h.y+Math.sin(i/n*6.283)*h.r, -HZ+D*z/NZ]);
    for(let i=0;i<n;i++) for(let z=0;z<=NZ;z++){
      const a=st+i*(NZ+1)+z; if(z<NZ) meshE.push([a,a+1]);
      meshE.push([a, st+((i+1)%n)*(NZ+1)+z]);
    }
  }
  const jitter = pts.map(()=>[(Math.random()-.5)*0.035,(Math.random()-.5)*0.035,(Math.random()-.5)*0.035]);

  /* каркас параметрической модели */
  const wire = [];
  for(let i=0;i<PROF.length;i++){
    const A=PROF[i], B=PROF[(i+1)%PROF.length];
    wire.push([[A[0],A[1],HZ],[B[0],B[1],HZ]]);
    wire.push([[A[0],A[1],-HZ],[B[0],B[1],-HZ]]);
    wire.push([[A[0],A[1],HZ],[A[0],A[1],-HZ]]);
  }
  for(const h of HOLES){ const n=20;
    for(let i=0;i<n;i++){
      const a=i/n*6.283, b=(i+1)/n*6.283;
      wire.push([[h.x+Math.cos(a)*h.r,h.y+Math.sin(a)*h.r,HZ],[h.x+Math.cos(b)*h.r,h.y+Math.sin(b)*h.r,HZ]]);
      wire.push([[h.x+Math.cos(a)*h.r,h.y+Math.sin(a)*h.r,-HZ],[h.x+Math.cos(b)*h.r,h.y+Math.sin(b)*h.r,-HZ]]);
    }
  }

  let prog = 0, vis = false;
  const stepsEls = [...document.querySelectorAll('.re-step')];
  const stEl=document.getElementById('reSt'), hEl=document.getElementById('reH'),
        dEl=document.getElementById('reD'), cntEl=document.getElementById('reCounter');
  const setHeight = () => { wrap.style.height = (innerWidth<760 ? 520 : 640) + 'vh'; };
  setHeight(); addEventListener('resize', setHeight);

  let lastStep = -1;
  function updateProgress(){
    const r = wrap.getBoundingClientRect();
    const total = r.height - innerHeight;
    prog = Math.max(0, Math.min(1, -r.top / total));
    vis = r.top < innerHeight && r.bottom > 0;
    const n = SITE.reverse.steps.length;
    const idx = Math.max(0, Math.min(n-1, Math.floor(prog*n)));
    const frac = Math.max(0, Math.min(1, prog*n - idx));
    if (idx !== lastStep){
      lastStep = idx;
      const s = SITE.reverse.steps[idx];
      stEl.textContent = `${s.n} · ${s.t}`; hEl.textContent = s.h; dEl.textContent = s.d;
      cntEl.textContent = `${s.n} / 0${n}`;
      stepsEls.forEach((e,i)=>e.classList.toggle('on', i===idx));
    }
    stepsEls.forEach((e,i)=>{
      e.querySelector('.fill').style.width = i<idx ? '100%' : (i===idx ? (frac*100)+'%' : '0%');
    });
  }
  addEventListener('scroll', updateProgress, {passive:true});
  addEventListener('resize', updateProgress);
  updateProgress();

  /* ---- отрисовка ---- */
  const COLD='127,178,217', HOT='255,101,0', STEEL='185,193,201';
  let t=0;
  function draw(){
    requestAnimationFrame(draw);
    if (!vis) return;
    const {ctx,w,h} = fitCanvas(cv);
    ctx.clearRect(0,0,w,h);
    t += 0.006;
    const st = Math.max(0, Math.min(6, prog*7 - 0.5));   // 0..6 — стадии
    const seg = i => Math.max(0, Math.min(1, st - i));   // «сколько уже прошло от стадии i»
    const band = (a,b) => Math.max(0, Math.min(1, Math.min(st-a, b-st)*2.2)); // видимость в интервале

    const mobile = w < 760;
    const cx = w*(mobile?0.5:0.66), cy = h*(mobile?0.34:0.5);
    const sc = Math.min(w*(mobile?0.52:0.30), h*(mobile?0.34:0.55));
    const ry = -0.62 + Math.sin(t*0.5)*0.10 + st*0.16;
    const rx = 0.34 + Math.cos(t*0.4)*0.05;
    const pr = p => { const r=RM(p,rx,ry); const z=r[2]+4.2; const f=sc*2.0/z; return [cx+r[0]*f, cy - r[1]*f, z]; };

    /* --- 0/6: тело детали (плоские грани) --- */
    const solidA = Math.max(band(-1, 1.15), band(5.55, 7));
    if (solidA > 0.01){
      const hot = st > 5.4;
      const capPath = (z) => {
        const p = new Path2D();
        PROF.forEach((v,i)=>{ const q=pr([v[0],v[1],z]); i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]); });
        p.closePath();
        for (const hl of HOLES){ const n=24;
          for(let i=0;i<=n;i++){ const a=i/n*6.283; const q=pr([hl.x+Math.cos(a)*hl.r, hl.y+Math.sin(a)*hl.r, z]);
            i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]); }
        }
        return p;
      };
      const base = hot ? [255,120,60] : [150,158,167];
      ctx.save(); ctx.globalAlpha = solidA;
      /* боковые грани */
      for(let i=0;i<PROF.length;i++){
        const A=PROF[i], B=PROF[(i+1)%PROF.length];
        const nx=(B[1]-A[1]), ny=-(B[0]-A[0]); const nl=Math.hypot(nx,ny);
        const nr = RM([nx/nl, ny/nl, 0], rx, ry);
        if (nr[2] < 0.02) continue;
        const q=[pr([A[0],A[1],HZ]),pr([B[0],B[1],HZ]),pr([B[0],B[1],-HZ]),pr([A[0],A[1],-HZ])];
        const li = 0.30 + 0.55*Math.max(0, nr[0]*0.5 + nr[1]*0.35 + nr[2]*0.5);
        ctx.fillStyle = `rgb(${base.map(c=>Math.round(c*li)).join(',')})`;
        ctx.beginPath(); q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill();
      }
      /* лицевая грань */
      const nz = RM([0,0,1],rx,ry)[2];
      const li = 0.42 + 0.5*Math.abs(nz);
      ctx.fillStyle = `rgb(${base.map(c=>Math.round(c*li)).join(',')})`;
      ctx.fill(capPath(nz>0?HZ:-HZ), 'evenodd');
      ctx.strokeStyle = hot ? `rgba(${HOT},.9)` : 'rgba(255,255,255,.22)';
      ctx.lineWidth = 1; ctx.stroke(capPath(nz>0?HZ:-HZ));
      if (hot){
        ctx.strokeStyle = `rgba(${HOT},${0.25+0.2*Math.sin(t*6)})`; ctx.lineWidth = 3;
        ctx.stroke(capPath(nz>0?HZ:-HZ));
      }
      ctx.restore();
    }

    /* --- 1: сканирование --- */
    if (st > 0.25 && st < 2.4){
      const sw = Math.max(0, Math.min(1, (st-0.35)/1.05));
      const yScan = 1.05 - sw*2.0;
      const a = band(0.3, 2.3);
      ctx.save(); ctx.globalAlpha = a;
      ctx.strokeStyle = `rgba(${COLD},.85)`; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i=0;i<=40;i++){
        const x=-1.6+3.2*i/40; const q=pr([x,yScan,HZ+0.02]);
        i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);
      }
      ctx.stroke();
      ctx.fillStyle = `rgba(${COLD},.06)`;
      const g1=pr([-1.6,yScan,HZ+0.02]), g2=pr([1.6,yScan,HZ+0.02]), g3=pr([1.6,yScan+0.5,HZ+0.02]), g4=pr([-1.6,yScan+0.5,HZ+0.02]);
      ctx.beginPath(); [g1,g2,g3,g4].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* --- 1–3: облако точек --- */
    const cloudA = Math.max(band(0.45, 3.4), 0);
    if (cloudA > 0.01){
      const revealY = st < 1.4 ? (1.05 - Math.max(0,(st-0.35)/1.05)*2.0) : -1.4;
      const jf = st < 2.6 ? 1 : Math.max(0, 1-(st-2.6)*1.4);
      ctx.save(); ctx.globalAlpha = cloudA;
      for (let i=0;i<pts.length;i++){
        const p = pts[i];
        if (p[1] > revealY + 0.02 && st < 1.5) continue;
        const q = pr([p[0]+jitter[i][0]*jf, p[1]+jitter[i][1]*jf, p[2]+jitter[i][2]*jf]);
        const near = Math.max(0.15, Math.min(1, (5.2-q[2])/1.6));
        ctx.fillStyle = `rgba(${COLD},${0.25+near*0.5})`;
        ctx.fillRect(q[0], q[1], 1.5, 1.5);
      }
      ctx.restore();
    }

    /* --- 3: полигональная сетка --- */
    const meshA = band(2.5, 4.3);
    if (meshA > 0.01){
      ctx.save(); ctx.globalAlpha = meshA*0.5;
      ctx.strokeStyle = `rgba(${COLD},.55)`; ctx.lineWidth = 0.55;
      ctx.beginPath();
      for (const [a,b] of meshE){
        const A=pr(pts[a]), B=pr(pts[b]);
        ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]);
      }
      ctx.stroke(); ctx.restore();
    }

    /* --- 4: параметрическая модель --- */
    const wireA = band(3.5, 5.4);
    if (wireA > 0.01){
      ctx.save(); ctx.globalAlpha = wireA;
      ctx.strokeStyle = `rgba(${STEEL},.9)`; ctx.lineWidth = 1.1;
      ctx.beginPath();
      for (const [a,b] of wire){ const A=pr(a), B=pr(b); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); }
      ctx.stroke();
      /* размеры на модели */
      const A=pr([-1.25,-0.72,HZ]), B=pr([1.25,-0.72,HZ]);
      ctx.strokeStyle=`rgba(${HOT},.8)`; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(A[0],A[1]+26); ctx.lineTo(B[0],B[1]+26);
      ctx.moveTo(A[0],A[1]+20); ctx.lineTo(A[0],A[1]+32);
      ctx.moveTo(B[0],B[1]+20); ctx.lineTo(B[0],B[1]+32);
      ctx.stroke();
      ctx.fillStyle=`rgba(${HOT},.95)`; ctx.font='500 11px "IBM Plex Mono", monospace'; ctx.textAlign='center';
      ctx.fillText('250 ±0,2', (A[0]+B[0])/2, A[1]+40);
      const hq = pr([HOLES[1].x, HOLES[1].y, HZ]);
      ctx.strokeStyle='rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.moveTo(hq[0],hq[1]); ctx.lineTo(hq[0]+46,hq[1]-38); ctx.lineTo(hq[0]+96,hq[1]-38); ctx.stroke();
      ctx.fillStyle='rgba(233,236,239,.8)'; ctx.textAlign='left';
      ctx.fillText('⌀19 H8 · 3 отв.', hq[0]+50, hq[1]-43);
      ctx.restore();
    }

    /* --- 5: чертёж --- */
    const dwgA = band(4.55, 6.1);
    if (dwgA > 0.01){
      ctx.save(); ctx.globalAlpha = dwgA;
      const S2 = Math.min(w*(mobile?0.30:0.16), h*0.30);
      const ox = mobile ? w*0.5 : w*0.66, oy = cy;
      const p2 = (x,y)=>[ox + x*S2, oy - y*S2];
      ctx.strokeStyle = `rgba(${COLD},.85)`; ctx.lineWidth = 1.2;
      ctx.beginPath();
      PROF.forEach((v,i)=>{ const q=p2(v[0],v[1]); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); });
      ctx.closePath(); ctx.stroke();
      for(const hl of HOLES){
        const q=p2(hl.x,hl.y);
        ctx.beginPath(); ctx.arc(q[0],q[1],hl.r*S2,0,6.283); ctx.stroke();
        ctx.setLineDash([9,3,2,3]); ctx.strokeStyle='rgba(255,255,255,.3)';
        ctx.beginPath();
        ctx.moveTo(q[0]-hl.r*S2-9,q[1]); ctx.lineTo(q[0]+hl.r*S2+9,q[1]);
        ctx.moveTo(q[0],q[1]-hl.r*S2-9); ctx.lineTo(q[0],q[1]+hl.r*S2+9);
        ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle=`rgba(${COLD},.85)`;
      }
      /* вид сбоку */
      const sx = ox + 1.55*S2;
      ctx.strokeRect(sx, oy - 0.95*S2, D*S2, 1.67*S2);
      /* размеры */
      const a1=p2(-1.25,-0.72), b1=p2(1.25,-0.72);
      ctx.strokeStyle='rgba(255,255,255,.45)';
      ctx.beginPath();
      ctx.moveTo(a1[0],a1[1]+30); ctx.lineTo(b1[0],b1[1]+30);
      ctx.moveTo(a1[0],a1[1]+24); ctx.lineTo(a1[0],a1[1]+36);
      ctx.moveTo(b1[0],b1[1]+24); ctx.lineTo(b1[0],b1[1]+36);
      ctx.stroke();
      ctx.fillStyle='rgba(233,236,239,.75)'; ctx.font='500 11px "IBM Plex Mono", monospace'; ctx.textAlign='center';
      ctx.fillText('250', (a1[0]+b1[0])/2, a1[1]+26);
      ctx.textAlign='left';
      ctx.fillStyle='rgba(233,236,239,.55)';
      ctx.fillText('Ст3сп · t=6 · 2 шт.', p2(-1.25,1.2)[0], p2(-1.25,1.2)[1]);
      ctx.restore();
    }

    /* --- 6: искры на новой детали --- */
    if (st > 5.6){
      const a = band(5.6, 7);
      ctx.save(); ctx.globalAlpha = a;
      for (let i=0;i<16;i++){
        const ph = (t*2.4 + i*0.41) % 1;
        const q = pr([ -0.42 + Math.cos(i*2.1)*0.5, 0.95 - ph*1.2, HZ + 0.05 ]);
        ctx.fillStyle = `rgba(${HOT},${(1-ph)*0.8})`;
        ctx.fillRect(q[0], q[1], 2.2, 2.2);
      }
      ctx.restore();
    }
  }
  requestAnimationFrame(draw);
})();

/* просмотр кейсов: вкладки + exploded view */
document.querySelectorAll('.viewer').forEach(v=>{
  if (v.classList.contains('single')) return;   /* кейс с одним изображением */
  const panes = [...v.querySelectorAll('.pane')];
  const tabs = [...v.querySelectorAll('.vtab')];
  const explode = v.querySelector('.explode');
  const range = v.querySelector('input[type=range]');
  const groups = [...v.querySelectorAll('.pane[data-k="iso"] g[data-ex]')];

  const setEx = val => {
    const k = val/100;
    groups.forEach(g=>{
      const [dx,dy] = (g.dataset.ex||'0,0').split(',').map(Number);
      g.setAttribute('transform', `translate(${dx*k} ${dy*k})`);
    });
    const host = v.querySelector('.v3d');
    if (host && host.__explode) host.__explode(k);
  };
  range.addEventListener('input', e=>setEx(+e.target.value));

  tabs.forEach(tb=>tb.addEventListener('click', ()=>{
    tabs.forEach(t=>{ t.classList.toggle('on', t===tb); t.setAttribute('aria-selected', String(t===tb)); });
    panes.forEach(p=>p.classList.toggle('on', p.dataset.k===tb.dataset.k));
    const k = tb.dataset.k;
    explode.style.display = (k === 'm3d' && v.querySelector('.v3d')) ? 'flex' : 'none';
    if (k==='m3d') init3D(v.querySelector('.v3d'));
  }));
  if (!v.querySelector('.v3d')) explode.style.display = 'none';   /* нет модели — нечего разносить */

  /* лёгкий параллакс схемы при наведении (только desktop) */
  if (matchMedia('(hover:hover)').matches && !reduceMotion){
    const holder = v.querySelector('.pane[data-k="iso"] svg');
    v.addEventListener('pointermove', e=>{
      const r=v.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      if (holder) holder.style.transform = `translate(${x*10}px, ${y*8}px)`;
    });
    v.addEventListener('pointerleave', ()=>{ if(holder) holder.style.transform=''; });
  }
});

/* счётчики цифр */
document.querySelectorAll('[data-count]').forEach(el=>{
  const target = parseFloat(el.dataset.count);
  const unit = el.querySelector('.u');
  new IntersectionObserver((es,obs)=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    obs.disconnect();
    const dur = 1100, t0 = performance.now();
    const tick = now => {
      const k = Math.min(1,(now-t0)/dur);
      const val = Math.round(target * (1-Math.pow(1-k,3)));
      el.firstChild.nodeValue = String(val);
      if (k<1) requestAnimationFrame(tick);
    };
    if (reduceMotion){ el.firstChild.nodeValue = String(target); return; }
    requestAnimationFrame(tick);
  }),{threshold:.6}).observe(el);
  el.firstChild.nodeValue = '0';
  if(unit) unit.textContent = unit.textContent;
});

(function form(){

  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); }));

    const consent = document.getElementById('f-consent');
    if (!consent.checked){ consent.focus(); return say('Без согласия на обработку данных отправить заявку нельзя — иначе нам некуда вам ответить.'); }

    const lim = SITE.form.maxFileMB * 1024 * 1024;
    const okExt = /\.(jpe?g|png|webp|heic|pdf|dwg|dxf|ste?p|ig[se]s?|stl|zip|rar|docx?|xlsx?)$/i;
    const wrong = files.find(x=>!okExt.test(x.name));
    if (wrong) return say(`Файл «${wrong.name}» не подойдёт. Пришлите фото, PDF, DWG/DXF, STEP/STL, архив или документ.`);
    const heavy = files.find(x=>x.size > lim);
    if (heavy) return say(`Файл «${heavy.name}» больше ${SITE.form.maxFileMB} МБ — пришлите его отдельно в Telegram, а форму отправьте без него.`);
    if (files.length > SITE.form.maxFiles) return say(`За раз можно приложить до ${SITE.form.maxFiles} файлов. Остальное пришлём в переписке.`);

    const data = new FormData(f);

    if (SITE.form.endpoint){
      const label = btn.innerHTML;
      btn.disabled = true; btn.style.opacity = .6; btn.textContent = 'Отправляем…';

        const res = await fetch(SITE.form.endpoint, { method:'POST', body:data });

        if(!res.ok || out.ok === false) throw new Error(out.error || 'ошибка сервера');
        f.reset(); files=[]; render();
        msg.className = 'form-msg on ok';
        msg.innerHTML = '<b>Заявка принята.</b> Разберу задачу и отвечу на указанный контакт — обычно в течение рабочего дня, в выходные дольше. ' +
          'Если вопрос срочный, пишите напрямую: <a href="' + SITE.contacts.telegram.href + '" target="_blank" rel="noopener">' +
          SITE.contacts.telegram.value + '</a> или ' + SITE.contacts.phone.value + '.';
      }catch(err){
        say('Отправка не прошла: ' + err.message + '. Напишите в Telegram @dmklevtsov — разберём задачу там.');
      }finally{
        btn.disabled = false; btn.style.opacity = ''; btn.innerHTML = label;

    /* endpoint не подключён: собираем письмо */
    const body = [

      'Контакт — ' + data.get('contact'),

      data.get('task'),

  });
})();


/* =============================================================
   ЛОГИКА ОЦЕНКИ
   Часы = 0,95 × детали × k(вид работ) × k(новизна) × (1 + доп.)
   Цена = max(цена по деталям, часы × минимальная ставка) × срочность
   Модель проверена на четырёх реальных проектах студии.
   ============================================================= */
(function estimator(){
  const root = document.getElementById('calc');
  if (!root) return;
  const C = SITE.calc;
  const sel = { kind:2, size:2, nov:2, urg:0, extra:new Set() };
  const sumEl  = document.getElementById('calcSum');
  const metaEl = document.getElementById('calcMeta');
  const docsEl = document.getElementById('calcDocs');
  const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
  const round5 = n => Math.round(n/5000)*5000;
  const skl = (n,f) => { const a=n%100, b=n%10;
    return (a>10&&a<20)||b>=5||b===0 ? f[2] : b===1 ? f[0] : f[1]; };

  const nInput = document.getElementById('calcN');
  function compute(){
    const kind = C.kinds[sel.kind], nov = C.novelty[sel.nov];
    const exact = parseInt(nInput.value, 10);
    const size = (exact > 0 && exact <= 2000)
      ? { n: exact, label: String(exact), hint: 'указано точно' }
      : C.sizes[sel.size];
    const extras = [...sel.extra].map(i=>C.extras[i]);
    const addT = extras.reduce((s,e)=>s+e.t, 0);
    const hours = C.hoursPerPart * size.n * kind.k * nov.k * (1 + addT);
    const urgent = sel.urg === 1 ? C.urgentK : 1;
    const byParts = size.n * C.perPart * kind.k;
    const byHours = hours * C.rate;
    const price = Math.max(Math.max(byParts, byHours) * urgent, C.minPrice);
    const lo = Math.max(round5(price * (1 + C.spread[0])), C.minPrice);
    const hi = Math.max(round5(price * (1 + C.spread[1])), C.minPrice + 10000);
    const atFloor = price <= C.minPrice;
    const days = Math.round(hours / C.hoursPerDay / (sel.urg === 1 ? 1.6 : 1));
    return { hours:Math.round(hours), days, lo, hi, atFloor, kind, size, nov, extras };
  }

  function render(){
    const r = compute();
    sumEl.textContent = r.atFloor ? 'от ' + fmt(r.lo) : fmt(r.lo) + ' — ' + fmt(r.hi);
    metaEl.textContent = `${r.hours} ч работы · ориентировочно ${Math.max(r.days,1)} ${skl(Math.max(r.days,1),['рабочий день','рабочих дня','рабочих дней'])}`;
    const docs = [...r.kind.docs, ...r.extras.map(e=>e.doc)];
    docsEl.innerHTML = docs.map(d=>`<li>${d}</li>`).join('');
    return r;
  }

  root.querySelectorAll('.pill').forEach(b=>b.addEventListener('click', ()=>{
    const g = b.dataset.g, i = +b.dataset.i;
    if (g === 'extra'){
      sel.extra.has(i) ? sel.extra.delete(i) : sel.extra.add(i);
      b.classList.toggle('on');
    } else {
      sel[g] = i;
      b.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on', x===b));
    }
    render();
  }));
  nInput.addEventListener('input', render);
  render();

  /* черновик ТЗ уходит в форму заявки */
  document.getElementById('calcGo').addEventListener('click', ()=>{
    const r = compute();
    const draft = [
      `Задача — ${r.kind.label.toLowerCase()}.`,
      `Объект — ориентировочно ${r.size.label} ${skl(r.size.n,['деталь','детали','деталей'])} (${r.size.hint}).`,
      `Новизна — ${r.nov.label.toLowerCase()}, ${r.nov.hint}.`,
      r.extras.length ? `Дополнительно — ${r.extras.map(e=>e.label.toLowerCase()).join('; ')}.` : '',
      `Срок — ${sel.urg === 1 ? 'срочный' : 'обычный'}.`,
      '',
      `Оценка на сайте — ${r.atFloor ? 'от ' + fmt(r.lo) : fmt(r.lo) + ' — ' + fmt(r.hi)}, около ${r.hours} ч.`,
      '',
      'Что важно добавить — '
    ].filter(Boolean).join('\n');
    const ta = document.getElementById('f-task');
    ta.value = draft;
    const y = document.getElementById('brief').getBoundingClientRect().top + scrollY - 62;
    scrollTo({ top:y, behavior: reduceMotion ? 'auto' : 'smooth' });
    setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 600);
  });
})();


/* сцена первого экрана: знак собирается из деталей, вокруг вращается механика */
(function heroInit(){
  const cv = document.getElementById('heroCanvas');
  if (!cv) return;
  const S = heroScene(cv, { hot: getComputedStyle(document.body).getPropertyValue('--hot').trim() || '#FF6500',
                            reduce: reduceMotion });
  S.setNow(true);
  S.loadParts();                                   /* реальные модели деталей подгружаются фоном */
  setTimeout(()=>S.assemble(), reduceMotion ? 0 : 900);

  let visible = true, last = performance.now(), acc = 0;
  new IntersectionObserver(([e])=>{ visible = e.isIntersecting; }, {threshold:0}).observe(cv);
  if (matchMedia('(hover:hover)').matches && !reduceMotion){
    addEventListener('pointermove', e => S.pointer(e.clientX/innerWidth - .5, e.clientY/innerHeight - .5), {passive:true});
  }
  (function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if (!visible) return;
    const { w, h } = fitCanvas(cv);
    if (!w || !h) return;
    acc += dt;
    if (acc < (w < 760 ? 1/24 : 1/30)) return;   /* 30 к/с на десктопе, 24 на мобильных */
    S.frame(w, h, reduceMotion ? 0 : acc);
    acc = 0;
  })(performance.now());
})();

document.querySelectorAll('.faq-q').forEach(btn=>{

/* просмотр благодарственного письма целиком */
(function lightbox(){
  const box = document.createElement('div');
  box.className = 'lbox'; box.hidden = true;
  box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','Благодарственное письмо');
  box.innerHTML = '<button class="lbox-x" type="button" aria-label="Закрыть">×</button><img alt="">';
  document.body.appendChild(box);
  const img = box.querySelector('img'), x = box.querySelector('.lbox-x');
  let last = null;
  const close = () => { box.hidden = true; document.body.style.overflow = ''; if (last) last.focus(); };
  document.querySelectorAll('.letter-scan, .letter-open').forEach(b => b.addEventListener('click', () => {
    last = b; img.src = photoSrc(b.dataset.full); img.alt = b.getAttribute('aria-label');
    box.hidden = false; document.body.style.overflow = 'hidden'; x.focus();
  }));
  x.addEventListener('click', close);
  box.addEventListener('click', e => { if (e.target === box) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) close(); });
})();

/* плавный переход по якорям с учётом фиксированной шапки */
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const id = a.getAttribute('href').slice(1);
  const el = id === 'top' ? document.body : document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  const y = id==='top' ? 0 : el.getBoundingClientRect().top + window.scrollY - 62;
  window.scrollTo({ top:y, behavior: reduceMotion ? 'auto' : 'smooth' });
});


/* =============================================================
   3D-ПРОСМОТР РЕАЛЬНЫХ МОДЕЛЕЙ (GLB) — three.js, ленивая загрузка.
   Модель подключается по пути SITE.cases.items[].media.glb.
   Если файл недоступен (например, страница открыта с диска),
   просмотрщик молча остаётся на векторной схеме.
   ============================================================= */
async function init3D(host){
  if (!host || host.dataset.state) return;
  host.dataset.state = 'loading';
  const canvas = host.querySelector('canvas');
  const btn    = host.querySelector('.v3d-load');
  const status = host.querySelector('.v3d-status');
  const hint   = host.querySelector('.v3d-hint');
  btn.style.display = 'none';
  status.textContent = 'загрузка модели…';

  try{
    const THREE = await import('three');
    const [{GLTFLoader},{OrbitControls},{MeshoptDecoder},{RoomEnvironment}] = await Promise.all([
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/controls/OrbitControls.js'),
      import('three/addons/libs/meshopt_decoder.module.js'),
      import('three/addons/environments/RoomEnvironment.js')
    ]);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.8));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3,5,4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xff6500, 2.1);  rim.position.set(-4,1.5,-3); scene.add(rim);
    scene.add(new THREE.AmbientLight(0x8fa3b8, 0.5));

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    const gltf = await loader.loadAsync(host.dataset.src, e=>{
      if (e.total) status.textContent = 'загрузка модели… ' + Math.round(e.loaded/e.total*100) + '%';
    });

    const model = gltf.scene;
    model.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const radius = box.getBoundingSphere(new THREE.Sphere()).radius;

    /* единый «стальной» материал: цвет из модели, металл и шероховатость — общие */
    const seen = new Set();
    model.traverse(o=>{
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m=>{
        if (!m || seen.has(m.uuid)) return; seen.add(m.uuid);
        m.metalness = 0.82; m.roughness = 0.38; m.envMapIntensity = 1.15;
        if (m.color) m.color.lerp(new THREE.Color(0xB4BCC4), 0.45);
        m.flatShading = false;
      });
    });

    const pivot = new THREE.Group();
    pivot.add(model);
    model.position.sub(center);              /* центр сборки — в начало координат */
    const rot = (host.dataset.rot || '0,0,0').split(',').map(Number);
    if (rot.some(v => v)){                   /* доворот из настроек кейса: последовательно X → Y → Z */
      const R = Math.PI / 180;
      /* порядок Z → Y → X: так углы совпадают с проверочным рендером */
      pivot.rotateZ(rot[2]*R); pivot.rotateY(rot[1]*R); pivot.rotateX(rot[0]*R);
    }
    scene.add(pivot);

    /* --- разнесение по узлам: слоями по высоте + радиально --- */
    const assembly = model.children.find(c=>c.children.length > 3) || model;
    const parts = [];
    const tmpBox = new THREE.Box3(), tmpC = new THREE.Vector3();
    assembly.children.forEach(obj=>{
      tmpBox.setFromObject(obj); if (tmpBox.isEmpty()) return;
      tmpBox.getCenter(tmpC);
      const d = new THREE.Vector3(
        (tmpC.x - center.x) * 0.6,
        (tmpC.y - center.y) * 4 + 0.05,
        (tmpC.z - center.z) * 0.6
      );
      if (d.lengthSq() < 1e-6) d.set(0,1,0);
      d.normalize();
      const p1 = obj.parent.worldToLocal(tmpC.clone());
      const p2 = obj.parent.worldToLocal(tmpC.clone().add(d));
      parts.push({ obj, base: obj.position.clone(), dir: p2.sub(p1).normalize() });
    });
    host.__explode = k => {
      const a = k * radius * 0.5;
      parts.forEach(p => p.obj.position.copy(p.base).addScaledVector(p.dir, a));
    };

    const camera = new THREE.PerspectiveCamera(32, 1, radius/60, radius*60);
    const dist = radius / Math.sin(16 * Math.PI/180) * 0.62 * (parseFloat(host.dataset.zoom) || 1);   /* glbZoom из настроек кейса */
    camera.position.set(dist*0.72, dist*0.42, dist*0.58);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.07;
    controls.enablePan = false; controls.enableZoom = false;   /* колесо остаётся у страницы */
    controls.minPolarAngle = 0.15; controls.maxPolarAngle = Math.PI*0.52;
    controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.55;
    controls.addEventListener('start', ()=>{ controls.autoRotate = false; hint.style.opacity = 0; });

    /* масштаб «плюс/минус» без перехвата прокрутки */
    host.querySelectorAll('.v3d-zoom').forEach(b=>b.addEventListener('click', ()=>{
      const f = b.dataset.z === '+' ? 0.86 : 1.16;
      camera.position.multiplyScalar(f);
    }));

    const resize = ()=>{
      const r = host.getBoundingClientRect();
      if (!r.width || !r.height) return;
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
    };
    new ResizeObserver(resize).observe(host); resize();

    let visible = true;
    new IntersectionObserver(([e])=>{ visible = e.isIntersecting; }, {threshold:0}).observe(host);
    (function loop(){
      requestAnimationFrame(loop);
      if (!visible || !host.closest('.pane').classList.contains('on')) return;
      controls.update();
      renderer.render(scene, camera);
    })();

    host.dataset.state = 'ready';
    host.classList.add('ready');
    status.textContent = '';
    setTimeout(()=>{ hint.style.opacity = 0; }, 6000);

  }catch(err){
    console.warn('3D:', err);
    host.dataset.state = 'fail';
    host.classList.add('fail');
    const viewer = host.closest('.viewer');
    const next = viewer && viewer.querySelector('.vtab[data-k="dwg"]');
    if (next && viewer.querySelector('.vtab.on').dataset.k === 'm3d') next.click();
    status.innerHTML = 'модель не загрузилась по пути <code>' + host.dataset.src + '</code><br>' +
      'на хостинге она подключается автоматически · схема — на соседней вкладке';
  }
}

/* автозагрузка на десктопе, по кнопке — на мобильных и при экономии трафика */
document.querySelectorAll('.v3d').forEach(host=>{
  const btn = host.querySelector('.v3d-load');
  btn.addEventListener('click', ()=>init3D(host));
  const saveData = navigator.connection && navigator.connection.saveData;
  const auto = innerWidth >= 900 && !saveData;
  if (!auto) return;
  new IntersectionObserver((es,obs)=>es.forEach(e=>{
    if (e.isIntersecting){ obs.disconnect(); init3D(host); }
  }), {rootMargin:'200px'}).observe(host);
});

/* =============================================================
   МЕСТО ПОД РЕАЛЬНЫЕ 3D-МОДЕЛИ (GLB / GLTF)
   Сейчас во вкладке «Схема / 3D» — векторная схема с exploded view.
   Когда появятся модели:
     1) подключить в <head>:
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"><\/script>
     2) положить файлы по путям SITE.cases.items[].media.glb
     3) снять комментарий с вызова mountModels() ниже.
   Вкладки, тексты и остальная логика кейса не меняются.
   ============================================================= */
function mountModels(){
  SITE.cases.items.forEach(c=>{
    if (!c.media.glb) return;
    const viewer = document.querySelector(`.viewer[data-case="${c.id}"]`);
    const pane = viewer && viewer.querySelector('.pane[data-k="iso"]');
    if (!pane) return;
    pane.innerHTML = `<model-viewer src="${c.media.glb}" camera-controls auto-rotate
        shadow-intensity="0.6" exposure="0.9" style="width:100%;height:100%"></model-viewer>`;
    const ex = viewer.querySelector('.explode');
    if (ex) ex.style.display = 'none';  /* разнесение переносится в саму модель */
  });
}
